# ENISA Single Reporting Platform — reporting template field catalogue.
#
# Source: SRP FAQ Q16, "What are the data fields to be filled in the reporting
# template?", enisa.europa.eu, as published 31 July 2026.
#
# Transcribed verbatim, including ENISA's own row ids and their quirks (the
# incident "Detailed description" parent row carries no id in the published
# table; it is given `i20a` here and flagged). Field labels are ENISA's
# wording, not paraphrases — an auditor comparing our draft against the
# platform should find the same words.
#
# ENISA describes these as "obligatory (stemming directly from CRA or
# identified by logical consequence) or optional", and the platform is not yet
# live. Treat the catalogue as provisional: when it changes, add v2 rather than
# editing v1. Drafts record the version they were produced under, because the
# technical file is retained ten years and a 2036 auditor must be able to see
# which template a 2026 report was written against.
#
# Markers, per ENISA:
#   X  obligatory
#   O  optional
#   C  by default copied from previous step, or updated
#   A  automated (not visible for the submitter)
#   I  obligatory if such information available
#
# `stages` is [24h, 72h, final]. A null entry means ENISA's table leaves the
# cell blank — see `i22`.

version: v1
source: ENISA SRP FAQ Q16
retrieved: 2026-08-05
published: 2026-07-31
provisional: true

fields:
  # ---- common to both streams --------------------------------------------
  - id: "1"
    stream: common
    label: Notification type (Vulnerability/Incident)
    stages: [X, C, C]
  - id: "2"
    stream: common
    label: Notification level (24h/72h/Final)
    stages: [X, X, X]
  - id: "3"
    stream: common
    label: Reporting time - 24h
    stages: [A, A, A]
  - id: "4"
    stream: common
    label: Reporting time - 72h
    stages: [A, A, A]
  - id: "5"
    stream: common
    label: Reporting time - Final
    stages: [A, A, A]
  - id: "6"
    stream: common
    label: Reporter
    stages: [A, A, A]
  - id: "7"
    stream: common
    label: Name of manufacturer or open-source software steward
    stages: [X, C, C]
  - id: "8"
    stream: common
    label: Product
    stages: [X, C, C]
  - id: "9"
    stream: common
    label: Product Type (Default/Important/Critical)
    stages: [O, C, C]
  - id: "10"
    stream: common
    label: Product Category (If Product Type other than Default - CRA Annex III/IV)
    stages: [O, C, C]
  - id: "11"
    stream: common
    label: Member States where product available
    stages: [I, C, C]
  - id: "12"
    stream: common
    label: Title
    stages: [X, C, C]

  # ---- actively exploited vulnerability -----------------------------------
  - id: v13
    stream: vulnerability
    label: CVE ID
    stages: [O, C, C]
  - id: v14
    stream: vulnerability
    label: EUVD ID
    stages: [O, C, C]
  - id: v15
    stream: vulnerability
    label: "General information, in particular:"
    stages: [O, X, C]
    parent: true
  - id: v16
    stream: vulnerability
    label: a. General nature of the vulnerability
    stages: [O, X, C]
    parent_id: v15
  - id: v17
    stream: vulnerability
    label: b. General nature of the exploit
    stages: [O, X, C]
    parent_id: v15
  - id: v18
    stream: vulnerability
    label: Corrective or mitigating measures taken
    stages: [O, X, C]
  - id: v19
    stream: vulnerability
    label: Corrective or mitigating measures that users can take
    stages: [O, X, C]
  - id: v20
    stream: vulnerability
    label: Considered sensitivity of information
    stages: [O, I, C]
  - id: v21
    stream: vulnerability
    label: Date when corrective or mitigating measure has been available
    stages: [O, O, X]
  - id: v22
    stream: vulnerability
    label: "Full description of the vulnerability, incl.:"
    stages: [O, O, X]
    parent: true
  - id: v23
    stream: vulnerability
    label: a. Severity of the vulnerability
    stages: [O, O, X]
    parent_id: v22
  - id: v24
    stream: vulnerability
    label: b. Impact of the vulnerability
    stages: [O, O, X]
    parent_id: v22
  - id: v25
    stream: vulnerability
    label: Malicious actor that has exploited / is exploiting the vulnerability
    stages: [O, O, I]
  - id: v26
    stream: vulnerability
    label: Details about the security update / corrective measures available
    stages: [O, O, X]

  # ---- severe incident -----------------------------------------------------
  - id: i13
    stream: incident
    label: Incident is suspected by unlawful or malicious acts
    stages: [X, C, C]
  - id: i14
    stream: incident
    label: General information, about the nature of the incident
    stages: [O, X, C]
  - id: i15
    stream: incident
    label: Date and time when the incident was detected
    stages: [O, X, C]
  - id: i16
    stream: incident
    label: Date and time when the incident occurred
    stages: [O, X, C]
  - id: i17
    stream: incident
    label: Initial assessment of the incident
    stages: [O, X, C]
  - id: i18
    stream: incident
    label: Corrective or mitigating measures taken
    stages: [O, X, C]
  - id: i19
    stream: incident
    label: Corrective or mitigating measures that users can take
    stages: [O, X, C]
  - id: i20
    stream: incident
    label: Considered sensitivity of information
    stages: [O, I, C]
  - id: i20a
    stream: incident
    label: "Detailed description of the incident, incl.:"
    stages: [O, O, X]
    parent: true
    note: >-
      ENISA's published table gives this row no id, though its vulnerability
      counterpart (v22) has one. `i20a` is ours, so the row can be referenced;
      it is not an ENISA identifier.
  - id: i21
    stream: incident
    label: "a. Severity of the incident:"
    stages: [O, O, X]
    parent_id: i20a
  - id: i22
    stream: incident
    label: >-
      1) it negatively affects or is capable of negatively affecting the
      ability of a product with digital elements to protect the availability,
      authenticity, integrity or confidentiality of sensitive or important
      data or functions; 2) it has led or is capable of leading to the
      introduction or execution of malicious code in a product with digital
      elements or in the network and information systems of a user of the
      product with digital elements
    stages: [null, null, null]
    parent_id: i21
    guidance_only: true
    note: >-
      ENISA's table leaves all three cells blank. These are the two limbs of
      the CRA's definition of a severe incident, printed under "Severity" as
      the test to apply — not a field to fill in. Rendered as guidance beside
      i21, never collected.
  - id: i23
    stream: incident
    label: b. Impact of the incident
    stages: [O, O, X]
    parent_id: i20a
  - id: i24
    stream: incident
    label: Type of threat or root cause that is likely to have triggered the incident
    stages: [O, O, X]
  - id: i25
    stream: incident
    label: Applied and ongoing mitigation measures
    stages: [O, O, X]
